server.port=8080

spring.application.name=API-GATEWAY

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=*

spring.cloud.gateway.routes[0].id=usuario-ms
spring.cloud.gateway.routes[0].uri=lb://MS-USUARIO
spring.cloud.gateway.routes[0].predicates[0]=Path=/usuarios/**

spring.cloud.gateway.routes[1].id=contenido-ms
spring.cloud.gateway.routes[1].uri=lb://MS-CONTENIDO
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**

spring.cloud.gateway.routes[2].id=feed-ms
spring.cloud.gateway.routes[2].uri=lb://MS-FEED
spring.cloud.gateway.routes[2].predicates[0]=Path=/feed/**
