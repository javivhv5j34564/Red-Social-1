# ============================
# PUERTO DEL MICROSERVICIO
# ============================
server.port=8081

# ============================
# CONFIGURACIÓN DE BBDD (H2 por defecto para desarrollo)
# Para usar MySQL, activa el profile `mysql` y configura las credenciales en
# `application-mysql.properties`.
# ============================
spring.datasource.url=jdbc:h2:mem:msusuario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Naming strategies
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# ============================
# NOMBRE DEL MICROSERVICIO (para Eureka)
# ============================
spring.application.name=MS-USUARIO

# ============================
# EUREKA CLIENT
# ============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
